services:
  oskari:
    build:
      context: ./oskari
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: oskaridb
      DB_USER: oskari
      DB_PASSWORD: oskari
      POSTGRES_SUPERUSER: db_dev_user
      POSTGRES_SUPERPASSWORD: DevPassword
      OSKARI_DOMAIN: http://localhost:8080
      OSKARI_SECURE: "false"
    volumes:
      - ./oskari/custom:/opt/maapallo-custom:ro
      - ./oskari/dev-entrypoint.sh:/dev-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/dev-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  geoserver:
    build:
      context: ./geoserver
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=db_dev
      - POSTGRES_USER=db_dev_user
      - POSTGRES_PASSWORD=DevPassword
      - GEOSERVER_CSRF_DISABLED=true
      - GEOSERVER_CORS_ENABLED=true
      - GEOSERVER_CORS_ALLOWED_ORIGINS=http://localhost:8080
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
      - ./geoserver/uploads:/opt/geoserver/uploads
      - ./geoserver/source_data:/opt/geoserver/source_data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8080/geoserver/web/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgis/postgis:13-3.3-alpine
    restart: always
    environment:
      POSTGRES_USER: db_dev_user
      POSTGRES_PASSWORD: DevPassword
      POSTGRES_DB: db_dev
    volumes:
      - db-volume:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: psql -U db_dev_user -d db_dev -c "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-volume:
  pgadmin-data:
  geoserver-data:

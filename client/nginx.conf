server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Set charset for all text files
    charset utf-8;

    # Basic authentication (protect frontend content); disabled for /api, /geoserver, and /healthz below
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Log to stdout/stderr for container platforms
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Proxy API calls to backend server
    location /api/ {
        # Do not require auth for API endpoints
        auth_basic off;
        # In Azure Container Apps, call other apps by name (no port). The platform routes to targetPort.
        proxy_pass http://maapallo-server;
        # Ensure Host header matches the destination app for correct ACA routing
        proxy_set_header Host maapallo-server;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Force HTTP/1.1 for communication
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # IMPORTANT: prevent browsers from showing a Basic Auth prompt when backend returns 401
        # by hiding the WWW-Authenticate header from proxied responses
        proxy_hide_header WWW-Authenticate;

        # Add CORS headers for API requests
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Handle CORS preflight for any /api/* path
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 200;
        }
    }

    # Proxy GeoServer requests to GeoServer container
    # Normalize RESTful WFS path (if client uses /geoserver/{workspace}/wfs, rewrite to /geoserver/wfs)
    location ~ ^/geoserver/[^/]+/wfs(.*)$ {
        auth_basic off;
        return 307 /geoserver/wfs$1;
    }

    location /geoserver/ {
        # Do not require auth for GeoServer endpoints
        auth_basic off;
        # Use ACA internal name without port; keep path prefix for GeoServer context root
        proxy_pass http://maapallo-geoserver/geoserver/;
        # Ensure Host header matches the destination app for correct ACA routing
        proxy_set_header Host maapallo-geoserver;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Force HTTP/1.1 for communication
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Prevent browser modal auth prompts if GeoServer ever responds with a Basic challenge
        proxy_hide_header WWW-Authenticate;

        # Add CORS headers for GeoServer requests
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # (Preflight for /api handled inside the /api/ block above)

    # Liveness/health endpoint (no auth)
    location = /healthz {
        auth_basic off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Handle SPA routing - try files, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure HTML files are served with UTF-8 charset
    location ~* \.html$ {
        add_header Content-Type "text/html; charset=utf-8" always;
    }

    # CSS files with UTF-8 charset
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JavaScript files with UTF-8 charset
    location ~* \.js$ {
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Font files with proper MIME types
    location ~* \.(woff|woff2)$ {
        add_header Content-Type "font/woff; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(ttf|eot)$ {
        add_header Content-Type "font/ttf; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Enforce HTTPS for browsers and upgrade any insecure requests
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    # Discourage indexing entirely
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/javascript;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Set charset for all text files
    charset utf-8;

    # Proxy API calls to backend server
    location /api/ {
        proxy_pass https://maapallo-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Force HTTP/1.1 for internal communication
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Skip SSL verification for internal Azure Container Apps communication
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        # Add CORS headers for API requests
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Proxy GeoServer requests to GeoServer container
    location /geoserver/ {
        proxy_pass https://maapallo-geoserver/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Force HTTP/1.1 for internal communication
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Skip SSL verification for internal Azure Container Apps communication
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        # Add CORS headers for GeoServer requests
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Handle preflight OPTIONS requests
    location /api {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 200;
        }
    }

    # Handle SPA routing - try files, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ensure HTML files are served with UTF-8 charset
    location ~* \.html$ {
        add_header Content-Type "text/html; charset=utf-8" always;
    }

    # CSS files with UTF-8 charset
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JavaScript files with UTF-8 charset
    location ~* \.js$ {
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Font files with proper MIME types
    location ~* \.(woff|woff2)$ {
        add_header Content-Type "font/woff; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(ttf|eot)$ {
        add_header Content-Type "font/ttf; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/javascript;
}

name: Build, Test and Deploy to Azure

on:
  push:
    branches:
      - main
      - geoserver
  workflow_dispatch: # Allow manual triggering

env:
  ACR_REGISTRY: maapalloinforegistry.azurecr.io
  APP_NAME: maapallo-info-app
  RESOURCE_GROUP: maapallo-info-group
  LOCATION: northeurope

  # Database configuration
  DB_SERVER_NAME: maapallo-db-server

  # Container Apps environment
  CONTAINER_ENV_NAME: maapallo-env

jobs:
  build-and-deploy:
    name: Build and Deploy GeoServer Stack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_NGO }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_REGISTRY }}

      # Build and push all container images
      - name: Build and push Client image
        run: |
          docker build -f client/Dockerfile.production \
            --build-arg CESIUM_ION_TOKEN="${{ secrets.CESIUM_ION_TOKEN }}" \
            -t ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }} ./client
          docker push ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }}
          docker tag ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }} ${{ env.ACR_REGISTRY }}/maapallo-client:latest
          docker push ${{ env.ACR_REGISTRY }}/maapallo-client:latest

      - name: Build and push Server image
        run: |
          docker build -f server/Dockerfile -t ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }} ./server
          docker push ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }}
          docker tag ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }} ${{ env.ACR_REGISTRY }}/maapallo-server:latest
          docker push ${{ env.ACR_REGISTRY }}/maapallo-server:latest

      - name: Build and push GeoServer image
        run: |
          docker build -f geoserver/Dockerfile -t ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }} ./geoserver
          docker push ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }}
          docker tag ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }} ${{ env.ACR_REGISTRY }}/maapallo-geoserver:latest
          docker push ${{ env.ACR_REGISTRY }}/maapallo-geoserver:latest

      # Deploy infrastructure using Azure Container Apps
      - name: Deploy Container Apps Environment
        run: |
          # Register required resource providers
          echo "Registering Azure resource providers..."
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait
          az provider register --namespace Microsoft.DBforPostgreSQL --wait
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.ManagedIdentity --wait

          # Create resource group if it doesn't exist
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }}

          # Create or get managed identity for Container Apps
          echo "Creating managed identity for Container Apps..."
          if ! az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            az identity create \
              --name maapallo-container-identity \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }}
          fi

          # Get managed identity details
          IDENTITY_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv)
          IDENTITY_CLIENT_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query clientId -o tsv)
          IDENTITY_PRINCIPAL_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query principalId -o tsv)

          # Get ACR resource ID
          ACR_RESOURCE_ID=$(az acr show --name maapalloinforegistry --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv)

          # Check if role assignment already exists
          echo "Checking if AcrPull role is already assigned..."
          EXISTING_ASSIGNMENT=$(az role assignment list \
            --assignee $IDENTITY_PRINCIPAL_ID \
            --scope $ACR_RESOURCE_ID \
            --role AcrPull \
            --query "[].id" -o tsv)

          if [ -z "$EXISTING_ASSIGNMENT" ]; then
            echo "Assigning AcrPull role to managed identity..."
            az role assignment create \
              --assignee-object-id $IDENTITY_PRINCIPAL_ID \
              --assignee-principal-type ServicePrincipal \
              --scope $ACR_RESOURCE_ID \
              --role AcrPull \
              --output none || {
                echo "⚠️  Automatic role assignment failed. Creating role assignment using alternative method..."
                # Try with client ID instead
                az role assignment create \
                  --assignee $IDENTITY_CLIENT_ID \
                  --scope $ACR_RESOURCE_ID \
                  --role AcrPull \
                  --output none || {
                    echo "🔧 Manual role assignment required. Please run:"
                    echo "az role assignment create --assignee $IDENTITY_PRINCIPAL_ID --scope $ACR_RESOURCE_ID --role AcrPull"
                    echo "Or using client ID:"
                    echo "az role assignment create --assignee $IDENTITY_CLIENT_ID --scope $ACR_RESOURCE_ID --role AcrPull"
                  }
              }
          else
            echo "✅ AcrPull role is already assigned to managed identity"
          fi

          # Create Log Analytics workspace if it doesn't exist
          echo "Checking if Log Analytics workspace exists..."
          if ! az monitor log-analytics workspace show --name maapallo-log-analytics --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            echo "Creating Log Analytics workspace..."
            az monitor log-analytics workspace create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --workspace-name maapallo-log-analytics \
              --location ${{ env.LOCATION }}
          else
            echo "Log Analytics workspace already exists."
          fi

          # Get Log Analytics workspace details
          LOG_ANALYTICS_CUSTOMER_ID=$(az monitor log-analytics workspace show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name maapallo-log-analytics \
            --query customerId --output tsv)

          LOG_ANALYTICS_WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name maapallo-log-analytics \
            --query primarySharedKey --output tsv)

          # Create Container Apps environment with Log Analytics workspace
          echo "Checking if Container Apps environment already exists..."
          if az containerapp env show --name ${{ env.CONTAINER_ENV_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            echo "Container Apps environment ${{ env.CONTAINER_ENV_NAME }} already exists, skipping creation."
          else
            echo "Creating Container Apps environment..."
            az containerapp env create \
              --name ${{ env.CONTAINER_ENV_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }} \
              --logs-workspace-id "$LOG_ANALYTICS_CUSTOMER_ID" \
              --logs-workspace-key "$LOG_ANALYTICS_WORKSPACE_KEY"
          fi

      # Deploy PostgreSQL with PostGIS
      - name: Deploy PostgreSQL Database
        run: |
          # Check if PostgreSQL server exists
          echo "Checking if PostgreSQL server exists..."
          if az postgres flexible-server show --name ${{ env.DB_SERVER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            echo "PostgreSQL server ${{ env.DB_SERVER_NAME }} already exists, skipping creation."
          else
            echo "Creating PostgreSQL server with admin user: ${{ secrets.DB_ADMIN_USER }}"
            az postgres flexible-server create \
              --name ${{ env.DB_SERVER_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location ${{ env.LOCATION }} \
              --admin-user "${{ secrets.DB_ADMIN_USER }}" \
              --admin-password "${{ secrets.DB_ADMIN_PASSWORD }}" \
              --sku-name standard_d2s_v3 \
              --tier GeneralPurpose \
              --storage-size 256 \
              --storage-auto-grow Enabled \
              --backup-retention 14 \
              --version 15 \
              --high-availability Disabled \
              --public-access 0.0.0.0-255.255.255.255 || {
                echo "Server creation failed. It might already exist with different configuration."
                echo "Checking server status..."
                az postgres flexible-server show --name ${{ env.DB_SERVER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} || exit 1
              }
          fi

          # Create database if it doesn't exist
          echo "Checking if database exists..."
          if az postgres flexible-server db show --database-name ${{ secrets.DB_NAME }} --server-name ${{ env.DB_SERVER_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            echo "Database ${{ secrets.DB_NAME }} already exists, skipping creation."
          else
            echo "Creating database ${{ secrets.DB_NAME }}..."
            az postgres flexible-server db create \
              --database-name ${{ secrets.DB_NAME }} \
              --server-name ${{ env.DB_SERVER_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
          fi

          # Configure PostGIS extension
          echo "Configuring PostGIS extension..."

          # Enable pg_stat_statements in server parameters (PostGIS doesn't need preloading)
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.DB_SERVER_NAME }} \
            --name shared_preload_libraries \
            --value "pg_stat_statements"

          # Restart server to apply parameter changes
          echo "Restarting server to apply parameter changes..."
          az postgres flexible-server restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.DB_SERVER_NAME }}

          # Optimize for GIS workload
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.DB_SERVER_NAME }} \
            --name max_connections \
            --value "200"

          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.DB_SERVER_NAME }} \
            --name shared_buffers \
            --value "262144"

          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.DB_SERVER_NAME }} \
            --name effective_cache_size \
            --value "1572864"

          # Wait for server to be ready after parameter changes
          echo "Waiting for server restart..."
          sleep 60

          # Install PostGIS extensions in the database
          PGPASSWORD="${{ secrets.DB_ADMIN_PASSWORD }}" psql \
            -h ${{ env.DB_SERVER_NAME }}.postgres.database.azure.com \
            -U ${{ secrets.DB_ADMIN_USER }} \
            -d ${{ secrets.DB_NAME }} \
            -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_topology; CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" || echo "PostGIS extensions may already exist"

      # Deploy GeoServer
      - name: Deploy GeoServer Container
        run: |
          # Get managed identity details
          IDENTITY_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv)

          # Check if GeoServer container app exists and its state
          if az containerapp show --name maapallo-geoserver --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            # Check if the container app is in a failed state
            PROVISIONING_STATE=$(az containerapp show --name maapallo-geoserver --resource-group ${{ env.RESOURCE_GROUP }} --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")

            if [ "$PROVISIONING_STATE" = "Failed" ]; then
              echo "GeoServer container is in failed state. Deleting and recreating..."
              az containerapp delete \
                --name maapallo-geoserver \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --yes

              # Wait a moment for deletion to complete
              sleep 30

              echo "Creating new GeoServer container..."
              az containerapp create \
                --name maapallo-geoserver \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment ${{ env.CONTAINER_ENV_NAME }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }} \
                --target-port 8080 \
                --ingress external \
                --cpu 2.0 \
                --memory 4.0Gi \
                --min-replicas 1 \
                --max-replicas 3 \
                --user-assigned $IDENTITY_ID \
                --registry-identity $IDENTITY_ID \
                --registry-server ${{ env.ACR_REGISTRY }} \
                --env-vars \
                  "GEOSERVER_ADMIN_USER=${{ secrets.GEOSERVER_ADMIN_USER }}" \
                  "GEOSERVER_ADMIN_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                  "POSTGRES_HOST=${{ env.DB_SERVER_NAME }}.postgres.database.azure.com" \
                  "POSTGRES_PORT=5432" \
                  "POSTGRES_DB=${{ secrets.DB_NAME }}" \
                  "POSTGRES_USER=${{ secrets.DB_ADMIN_USER }}" \
                  "POSTGRES_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}"
            else
              echo "Updating existing GeoServer container..."
              # For existing apps, we need to update the identity and registry configuration first
              az containerapp identity assign \
                --name maapallo-geoserver \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --user-assigned $IDENTITY_ID || echo "Identity may already be assigned"

              # Update registry configuration
              az containerapp registry set \
                --name maapallo-geoserver \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --server ${{ env.ACR_REGISTRY }} \
                --identity $IDENTITY_ID || echo "Registry may already be configured"

              # Now update the container with new image
              az containerapp update \
                --name maapallo-geoserver \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }} \
                --set-env-vars \
                  "GEOSERVER_ADMIN_USER=${{ secrets.GEOSERVER_ADMIN_USER }}" \
                  "GEOSERVER_ADMIN_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                  "POSTGRES_HOST=${{ env.DB_SERVER_NAME }}.postgres.database.azure.com" \
                  "POSTGRES_PORT=5432" \
                  "POSTGRES_DB=${{ secrets.DB_NAME }}" \
                  "POSTGRES_USER=${{ secrets.DB_ADMIN_USER }}" \
                  "POSTGRES_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}"
            fi
          else
            echo "Creating new GeoServer container..."
            az containerapp create \
              --name maapallo-geoserver \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV_NAME }} \
              --image ${{ env.ACR_REGISTRY }}/maapallo-geoserver:${{ github.sha }} \
              --target-port 8080 \
              --ingress external \
              --cpu 2.0 \
              --memory 4.0Gi \
              --min-replicas 1 \
              --max-replicas 3 \
              --user-assigned $IDENTITY_ID \
              --registry-identity $IDENTITY_ID \
              --registry-server ${{ env.ACR_REGISTRY }} \
              --env-vars \
                "GEOSERVER_ADMIN_USER=${{ secrets.GEOSERVER_ADMIN_USER }}" \
                "GEOSERVER_ADMIN_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                "POSTGRES_HOST=${{ env.DB_SERVER_NAME }}.postgres.database.azure.com" \
                "POSTGRES_PORT=5432" \
                "POSTGRES_DB=${{ secrets.DB_NAME }}" \
                "POSTGRES_USER=${{ secrets.DB_ADMIN_USER }}" \
                "POSTGRES_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}"
          fi

      # Deploy Backend API
      - name: Deploy Server Container
        run: |
          # Get managed identity details
          IDENTITY_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv)

          # Get Container Apps environment default domain
          CONTAINER_DOMAIN=$(az containerapp env show --name ${{ env.CONTAINER_ENV_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv)

          # Check if Server container app exists and its state
          if az containerapp show --name maapallo-server --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            # Check if the container app is in a failed state
            PROVISIONING_STATE=$(az containerapp show --name maapallo-server --resource-group ${{ env.RESOURCE_GROUP }} --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")

            if [ "$PROVISIONING_STATE" = "Failed" ]; then
              echo "Server container is in failed state. Deleting and recreating..."
              az containerapp delete \
                --name maapallo-server \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --yes

              # Wait a moment for deletion to complete
              sleep 30

              echo "Creating new Server container..."
              az containerapp create \
                --name maapallo-server \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment ${{ env.CONTAINER_ENV_NAME }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }} \
                --target-port 3003 \
                --ingress external \
                --cpu 1.0 \
                --memory 2.0Gi \
                --min-replicas 1 \
                --max-replicas 5 \
                --user-assigned $IDENTITY_ID \
                --registry-identity $IDENTITY_ID \
                --registry-server ${{ env.ACR_REGISTRY }} \
                --env-vars \
                  "ENVIRONMENT=production" \
                  "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
                  "ADMIN_USERNAME=admin" \
                  "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
                  "DB_NAME=${{ secrets.DB_NAME }}" \
                  "DB_ADMIN_USER=${{ secrets.DB_ADMIN_USER }}" \
                  "DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}" \
                  "GEOSERVER_URL=https://maapallo-geoserver.$CONTAINER_DOMAIN" \
                  "GEOSERVER_INTERNAL_URL=http://maapallo-geoserver/geoserver" \
                  "GEOSERVER_USER=admin" \
                  "GEOSERVER_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                  "GEOSERVER_WORKSPACE=maapallo"
            else
              echo "Updating existing Server container..."
              # For existing apps, we need to update the identity and registry configuration first
              az containerapp identity assign \
                --name maapallo-server \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --user-assigned $IDENTITY_ID || echo "Identity may already be assigned"

              # Update registry configuration
              az containerapp registry set \
                --name maapallo-server \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --server ${{ env.ACR_REGISTRY }} \
                --identity $IDENTITY_ID || echo "Registry may already be configured"

              # Now update the container with new image
              az containerapp update \
                --name maapallo-server \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }} \
                --set-env-vars \
                  "ENVIRONMENT=production" \
                  "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
                  "ADMIN_USERNAME=admin" \
                  "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
                  "DB_NAME=${{ secrets.DB_NAME }}" \
                  "DB_ADMIN_USER=${{ secrets.DB_ADMIN_USER }}" \
                  "DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}" \
                  "GEOSERVER_URL=https://maapallo-geoserver.$CONTAINER_DOMAIN" \
                  "GEOSERVER_INTERNAL_URL=http://maapallo-geoserver/geoserver" \
                  "GEOSERVER_USER=admin" \
                  "GEOSERVER_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                  "GEOSERVER_WORKSPACE=maapallo"
            fi
          else
            echo "Creating new Server container..."
            az containerapp create \
              --name maapallo-server \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV_NAME }} \
              --image ${{ env.ACR_REGISTRY }}/maapallo-server:${{ github.sha }} \
              --target-port 3003 \
              --ingress external \
              --cpu 1.0 \
              --memory 2.0Gi \
              --min-replicas 1 \
              --max-replicas 5 \
              --user-assigned $IDENTITY_ID \
              --registry-identity $IDENTITY_ID \
              --registry-server ${{ env.ACR_REGISTRY }} \
              --env-vars \
                "ENVIRONMENT=production" \
                "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
                "ADMIN_USERNAME=admin" \
                "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" \
                "DB_NAME=${{ secrets.DB_NAME }}" \
                "DB_ADMIN_USER=${{ secrets.DB_ADMIN_USER }}" \
                "DB_ADMIN_PASSWORD=${{ secrets.DB_ADMIN_PASSWORD }}" \
                "GEOSERVER_URL=https://maapallo-geoserver.$CONTAINER_DOMAIN" \
                "GEOSERVER_INTERNAL_URL=http://maapallo-geoserver/geoserver" \
                "GEOSERVER_USER=admin" \
                "GEOSERVER_PASSWORD=${{ secrets.GEOSERVER_ADMIN_PASSWORD }}" \
                "GEOSERVER_WORKSPACE=maapallo"
          fi

      # Deploy Frontend
      - name: Deploy Client Container
        run: |
          # Get managed identity details
          IDENTITY_ID=$(az identity show --name maapallo-container-identity --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv)

          # Check if Client container app exists and its state
          if az containerapp show --name maapallo-client --resource-group ${{ env.RESOURCE_GROUP }} >/dev/null 2>&1; then
            # Check if the container app is in a failed state
            PROVISIONING_STATE=$(az containerapp show --name maapallo-client --resource-group ${{ env.RESOURCE_GROUP }} --query properties.provisioningState -o tsv 2>/dev/null || echo "Unknown")

            if [ "$PROVISIONING_STATE" = "Failed" ]; then
              echo "Client container is in failed state. Deleting and recreating..."
              az containerapp delete \
                --name maapallo-client \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --yes

              # Wait a moment for deletion to complete
              sleep 30

              echo "Creating new Client container..."

              # Get the environment default domain dynamically
              ENV_DEFAULT_DOMAIN=$(az containerapp env show \
                --name ${{ env.CONTAINER_ENV_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query properties.defaultDomain \
                --output tsv)

              az containerapp create \
                --name maapallo-client \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --environment ${{ env.CONTAINER_ENV_NAME }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }} \
                --target-port 8080 \
                --ingress external \
                --cpu 0.5 \
                --memory 1.0Gi \
                --min-replicas 1 \
                --max-replicas 3 \
                --user-assigned $IDENTITY_ID \
                --registry-identity $IDENTITY_ID \
                --registry-server ${{ env.ACR_REGISTRY }} \
                --env-vars \
                  "API_SERVER_URL=https://maapallo-server.${ENV_DEFAULT_DOMAIN}" \
                  "GEOSERVER_URL=https://maapallo-geoserver.${ENV_DEFAULT_DOMAIN}/geoserver" \
                  "BASIC_AUTH_USERNAME=${{ secrets.BASIC_AUTH_USERNAME }}" \
                  "BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}"
            else
              echo "Updating existing Client container..."

              # Get the environment default domain dynamically
              ENV_DEFAULT_DOMAIN=$(az containerapp env show \
                --name ${{ env.CONTAINER_ENV_NAME }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query properties.defaultDomain \
                --output tsv)

              # For existing apps, we need to update the identity and registry configuration first
              az containerapp identity assign \
                --name maapallo-client \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --user-assigned $IDENTITY_ID || echo "Identity may already be assigned"

              # Update registry configuration
              az containerapp registry set \
                --name maapallo-client \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --server ${{ env.ACR_REGISTRY }} \
                --identity $IDENTITY_ID || echo "Registry may already be configured"

              # Now update the container with new image
              az containerapp update \
                --name maapallo-client \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --image ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }} \
                --set-env-vars \
                  "API_SERVER_URL=https://maapallo-server.${ENV_DEFAULT_DOMAIN}" \
                  "GEOSERVER_URL=https://maapallo-geoserver.${ENV_DEFAULT_DOMAIN}/geoserver" \
                  "BASIC_AUTH_USERNAME=${{ secrets.BASIC_AUTH_USERNAME }}" \
                  "BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}"
            fi
          else
            echo "Creating new Client container..."

            # Get the environment default domain dynamically
            ENV_DEFAULT_DOMAIN=$(az containerapp env show \
              --name ${{ env.CONTAINER_ENV_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.defaultDomain \
              --output tsv)

            az containerapp create \
              --name maapallo-client \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --environment ${{ env.CONTAINER_ENV_NAME }} \
              --image ${{ env.ACR_REGISTRY }}/maapallo-client:${{ github.sha }} \
              --target-port 8080 \
              --ingress external \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 1 \
              --max-replicas 3 \
              --user-assigned $IDENTITY_ID \
              --registry-identity $IDENTITY_ID \
              --registry-server ${{ env.ACR_REGISTRY }} \
              --env-vars \
                "API_SERVER_URL=https://maapallo-server.${ENV_DEFAULT_DOMAIN}" \
                "GEOSERVER_URL=https://maapallo-geoserver.${ENV_DEFAULT_DOMAIN}/geoserver" \
                "BASIC_AUTH_USERNAME=${{ secrets.BASIC_AUTH_USERNAME }}" \
                "BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}"
          fi

      # Run initial setup
      - name: Initialize Application
        run: |
          echo "Waiting for containers to be ready..."
          sleep 60

          # Get the frontend URL
          FRONTEND_URL=$(az containerapp show --name maapallo-client --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)

          echo "✅ Application deployed successfully!"
          echo "🌐 Frontend URL: https://$FRONTEND_URL"
          echo "🗺️ GeoServer Admin: https://$(az containerapp show --name maapallo-geoserver --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)/geoserver"
          echo "🔧 API Endpoint: https://$(az containerapp show --name maapallo-server --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
